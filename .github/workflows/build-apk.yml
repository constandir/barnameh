name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # برای ساخت Release و گذاشتن APK در آن

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons and splash screen
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor '#c2410c' --iconBackgroundColorDark '#c2410c'
          --splashBackgroundColor '#f6f1e6' --splashBackgroundColorDark '#1b1a22'

      - name: Sync web files and plugins
        run: npx cap sync android

      - name: Set version (each build gets a higher number)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align and sign with the fixed key
        env:
          KS_PASS: journal-2026-key
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "build-tools: $BT / input: $UNSIGNED"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks journal.jks --ks-key-alias journal --ks-pass env:KS_PASS --key-pass env:KS_PASS --out year-journal.apk aligned.apk
          "$BT/apksigner" verify --print-certs year-journal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: year-journal-apk
          path: year-journal.apk

      - name: Publish as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" year-journal.apk \
            --title "دفتر سالانه ${{ github.run_number }}" \
            --notes "نسخه‌ی ${{ github.run_number }} — فایل year-journal.apk را دانلود و نصب کن."
