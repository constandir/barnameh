   دفتر سالانه‌ی من — تک‌فایل، بدون وابستگی خارجی
   ============================================================ */

/* ---------- پوسته‌ها (روشن / تاریک / خودکار) ---------- */
:root{
  --sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));
  --sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
  --sal:max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px));
  --sar:max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px));
  --bg:#f6f1e6; --paper:#fffdf8; --ink:#2b2a33; --muted:#6b6675; --line:#e6dfcf;
  --rule:rgba(120,100,60,.07); --field:#fffefb;
  --accent:#c2410c; --accent-ink:#ffffff; --star:#f5a524; --star-off:#d9d2c0;
  --danger:#b4232a; --ok:#15803d; --danger-bg:#b4232a; --accent-text:#9a3412;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 8px 24px rgba(60,40,10,.06);
  --radius:16px;
}
:root[data-theme="dark"]{
  --bg:#15141a; --paper:#1f1e26; --ink:#ece9f2; --muted:#a29eae; --line:#34313d;
  --rule:rgba(255,255,255,.035); --field:#18171d;
  --accent:#fb923c; --accent-ink:#1a1206; --star:#fbbf24; --star-off:#45414f;
  --danger:#f87171; --ok:#4ade80; --accent-text:#fb923c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15141a; --paper:#1f1e26; --ink:#ece9f2; --muted:#a29eae; --line:#34313d;
    --rule:rgba(255,255,255,.035); --field:#18171d;
    --accent:#fb923c; --accent-ink:#1a1206; --star:#fbbf24; --star-off:#45414f;
    --danger:#f87171; --ok:#4ade80; --accent-text:#fb923c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}

/* ---------- پایه ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,select,input,textarea,summary,a,label{touch-action:manipulation}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Vazirmatn","Vazir","Samim","IRANSans","Noto Naskh Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.75;
  padding-left:var(--sal); padding-right:var(--sar);
  background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);
}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:10px;z-index:100}
.skip:focus{top:8px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- سربرگ و ناوبری ---------- */
#top{padding-top:var(--sat);position:sticky;top:0;z-index:20;background:var(--bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
@supports (background:color-mix(in srgb,red,blue)){#top{background:color-mix(in srgb,var(--bg) 88%,transparent)}}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font-size:1.15rem;font-weight:800}
.logo{font-size:1.5rem}
.tools{display:flex;align-items:center;gap:8px}
.chip-btn,.year-sel{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 14px;min-height:38px;font-size:.9rem}
.year-sel{appearance:auto;padding-inline:10px}

#nav{position:fixed;inset-inline:0;bottom:0;z-index:25;display:flex;background:var(--paper);border-top:1px solid var(--line);padding:4px calc(4px + var(--sar)) calc(4px + var(--sab)) calc(4px + var(--sal))}
#nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 2px;border-radius:12px;font-size:.68rem;color:var(--muted);min-height:52px;line-height:1.3}
#nav button .ni{font-size:1.25rem;line-height:1.3}
#nav button[aria-current="page"]{color:var(--accent-text);background:rgba(194,65,12,.13);font-weight:700}
@supports (background:color-mix(in srgb,red,blue)){#nav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 12%,transparent)}}
@media (max-width:480px){
  .top-in{padding:6px 12px;gap:6px;flex-wrap:nowrap}
  .brand h1{font-size:1rem;white-space:nowrap}
  .brand{min-width:0}.logo{font-size:1.25rem}
  .tools{gap:6px;flex-shrink:0}
  .chip-btn,.year-sel{padding:2px 10px;min-height:36px;font-size:.85rem}
}
@media (max-width:350px){.top-in{flex-wrap:wrap}}
main{max-width:980px;margin:0 auto;padding:16px 16px 110px;outline:none}
@media (min-width:720px){
  #nav{position:static;max-width:980px;margin:12px auto 0;border:0;background:none;padding:0 16px;gap:6px;justify-content:flex-start}
  #nav button{flex:0 0 auto;flex-direction:row;gap:6px;padding:8px 16px;font-size:.95rem;min-height:42px;background:var(--paper);border:1px solid var(--line);border-radius:999px}
  #nav button .ni{font-size:1.05rem}
  #nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  main{padding-bottom:60px}
}

/* ---------- عناصر عمومی ---------- */
.view{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.sec{padding:18px}
.sec>h2{font-size:1.05rem;margin-bottom:12px;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 16px;min-height:42px;font-weight:600;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--danger-bg);color:#fff;border-color:var(--danger-bg)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.88rem}
.icon-btn{border:0;background:transparent;border-radius:10px;width:40px;height:40px;font-size:1.1rem;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:rgba(128,128,128,.16)}
@supports (background:color-mix(in srgb,red,blue)){.icon-btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(84px + var(--sab));z-index:24;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:2rem;line-height:1;box-shadow:0 8px 22px rgba(0,0,0,.28);display:grid;place-items:center;transition:transform .2s}
.fab:hover{transform:scale(1.07) rotate(90deg)}
@media (min-width:720px){.fab{bottom:28px}}
.muted{color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);min-width:0}
input[type=text],input[type=search],input[type=number],input[type=url],select,textarea{

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{font-size:.78rem;padding:0 10px;border-radius:99px;background:rgba(128,128,128,.18);border:0;color:var(--ink)}
@supports (background:color-mix(in srgb,red,blue)){.tag{background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent)}}

.actions{display:flex;gap:0;margin-inline-start:-8px;flex-wrap:wrap}

.quick-add{padding:14px;display:grid;gap:10px}

/* ---------- پیشرفت ---------- */

.item.dragging{opacity:.9;box-shadow:0 12px 30px rgba(0,0,0,.25);transform:scale(1.01);position:relative;z-index:2}

.det-grid .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- مدیریت تگ ---------- */
.tag-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}

.legend{display:grid;gap:2px;flex:1;min-width:150px}

@supports (background:color-mix(in srgb,red,blue)){.legend button:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}}

.mcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-size:.7rem;color:var(--muted);min-width:0}
.mcol .b{width:100%;max-width:28px;background:var(--accent);border-radius:7px 7px 0 0;min-height:3px;opacity:.9;transition:height .5s ease}

.top5{list-style:none;margin:0;padding:0;display:grid;gap:8px}

.rank{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:0 0 28px}
.top5 .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- اهداف ---------- */
.goal{display:grid;grid-template-columns:44px minmax(0,1fr) 90px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}

.goal .gi{font-size:1.6rem;text-align:center}
.goal .gt{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;margin-bottom:4px}
.goal input{text-align:center}

/* ---------- خلاصه‌ی سال ---------- */
.wrapped{background:linear-gradient(150deg,#1e1b4b 0%,#7c2d12 62%,#c2410c 100%);color:#fff;border-radius:26px;padding:28px 22px;display:grid;gap:20px;box-shadow:var(--shadow);-webkit-print-color-adjust:exact;print-color-adjust:exact}

.wrapped .hero b{font-size:2.2rem}
.w-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.w-tile{background:rgba(255,255,255,.12);border-radius:16px;padding:12px;text-align:center}
.w-tile b{display:block;font-size:1.5rem}
.w-tile span{font-size:.82rem;opacity:.85}
.wrapped h3{font-size:1rem;opacity:.9;margin-bottom:8px}
.w-cats{display:flex;flex-wrap:wrap;gap:8px}
.w-pill{background:rgba(255,255,255,.14);border-radius:99px;padding:4px 14px;font-size:.9rem}

.data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.data-grid .btn{width:100%}

dialog.dlg{border:0;border-radius:22px;padding:0;width:calc(100vw - 24px);max-width:420px;max-height:calc(100dvh - 24px);overflow:auto;background:var(--paper);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.4)}

#toast .toast-act{background:#2b2a33;color:#fcd34d;border:0;padding:10px 16px 10px 18px;border-radius:0 14px 14px 0;border-inline-start:1px solid rgba(255,255,255,.2);font-weight:700}

/* ---------- چاپ ---------- */
#printRoot{display:none}
/* ---------- بهینه‌سازی موبایل ---------- */
@media (pointer:coarse){
  .icon-btn{width:44px;height:44px}
  .emoji-grid button{width:44px;height:44px}
  .swatches button{width:38px;height:38px}

}
@media (max-width:719px){
  #top{backdrop-filter:none}                       /* محو کردن پس‌زمینه روی گوشی‌های ضعیف سنگین است */
  .item{animation-duration:.2s}
  /* پنجره‌ها روی موبایل مثل برگه‌ی پایین‌آمده (bottom sheet) */
  dialog.dlg{width:100vw;max-width:none;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92vh;max-height:92dvh}
  dialog.dlg[open]{animation:sheet .22s ease}
  .dlg-body{padding:20px 20px calc(20px + var(--sab))}
  dialog.dlg::backdrop{backdrop-filter:none}
}
@keyframes sheet{from{transform:translateY(36px);opacity:.4}to{transform:none;opacity:1}}
@media print{
  :root:root:root{--bg:#fff;--paper:#fff;--ink:#111;--muted:#444;--line:#ccc;--rule:transparent;--field:#fff;--accent:#9a3412;--star:#d97706;--star-off:#ccc}
  body{background:#fff!important;background-image:none!important}

  #printRoot{display:block!important;padding:0}
  #printRoot h1{font-size:1.6rem;margin-bottom:2px}
  #printRoot .sub{color:#555;margin-bottom:14px}
  .prow{break-inside:avoid;border-bottom:1px solid #ccc;padding:8px 0}
  .prow .ph{display:flex;justify-content:space-between;gap:8px}
  .prow .pm{font-size:.82rem;color:#555}
  .prow p{font-size:.92rem;white-space:pre-wrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){

/* ============================================================

/*JAL-START*/
function div(a,b){return ~~(a/b);}

const BREAKS=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){
  let bl=BREAKS.length,gy=jy+621,leapJ=-14,jp=BREAKS[0],jm,jump=0,leap,leapG,march,n,i;
  for(i=1;i<bl;i+=1){

    if(jy<jm)break;

  leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);

  return {leap,gy,march};
}
function g2d(gy,gm,gd){
  let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;

  let j=4*jdn+139361631;

  const i=div(mod(j,1461),4)*5+308;

const KINDS={

/* ساخت امن DOM (بدون innerHTML؛ همه‌ی متن‌ها با textContent) */
function h(tag,props,...kids){
  const e=document.createElement(tag);
  if(props)for(const k in props){
    const v=props[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k==='style')e.style.cssText=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(PROP.has(k))e[k]=v;
    else e.setAttribute(k,v===true?'':v);
  }
  for(const kid of kids.flat(Infinity)){
    if(kid==null||kid===false)continue;
    e.append(kid instanceof Node?kid:document.createTextNode(String(kid)));
  }
  return e;
}
function select(opts,value,onchange,props){
  const s=h('select',props||{});
  opts.forEach(([v,t])=>s.append(h('option',{value:String(v),text:t})));
  s.value=String(value);
  if(onchange)s.addEventListener('change',()=>onchange(s.value));
  return s;
}
/* نرمال‌سازی متن برای جستجو (ی/ک عربی، ارقام فارسی و عربی) */
function norm(s){
  return String(s).toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک')
    .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}

/* ============================================================
   ۳) تاریخ‌ها (ذخیره به‌صورت میلادی ISO؛ نمایش شمسی یا میلادی)
   ============================================================ */
function todayISO(offsetDays=0){
  const d=new Date(Date.now()-offsetDays*DAY);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function parseISO(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');
  if(!m)return null;
  const y=+m[1],mo=+m[2],d=+m[3];
  if(mo<1||mo>12||d<1||d>31)return null;
  return {y,m:mo,d};
}
function toCal(iso,cal){
  cal=cal||S.settings.cal;
  const p=parseISO(iso);
  if(!p)return {y:0,m:1,d:1};
  if(cal==='gregorian')return p;
  const j=d2j(g2d(p.y,p.m,p.d));
  return {y:j.jy,m:j.jm,d:j.jd};
}
function fromCal(y,m,d,cal){
  cal=cal||S.settings.cal;
  if(cal==='gregorian')return `${y}-${pad(m)}-${pad(d)}`;
  const g=d2g(j2d(y,m,d));
  return `${g.gy}-${pad(g.gm)}-${pad(g.gd)}`;
}
function monthLen(y,m){
  if(S.settings.cal==='gregorian')return new Date(y,m,0).getDate();
  return m<=6?31:(m<=11?30:(jalCal(y).leap===0?30:29));
}
const monthNames=()=>S.settings.cal==='jalali'?JM:GM;
const monthShort=()=>S.settings.cal==='jalali'?JMS:GMS;
function fmtDate(iso,cal){
  cal=cal||S.settings.cal;
  const c=toCal(iso,cal);
  return `${fa(c.d)} ${(cal==='jalali'?JM:GM)[c.m-1]} ${fa(c.y)}`;
}
const yearOf=iso=>toCal(iso).y;
const curYear=()=>toCal(todayISO()).y;

function emptyState(){

}
function safeUrl(u){
  u=String(u||'').trim();
  if(!u)return '';
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;
  try{
    const x=new URL(u);
    return (x.protocol==='http:'||x.protocol==='https:')?x.href:'';
  }catch(e){return '';}
}
function cleanTags(t){
  const arr=Array.isArray(t)?t:String(t||'').split(/[,،\n]/);
  const out=[];
  for(const x of arr){
    const s=String(x).trim().slice(0,30);
    if(s&&!out.includes(s))out.push(s);
    if(out.length>=20)break;
  }
  return out;
}
/* ورودی عددی با ارقام فارسی/عربی و جداکننده‌ی اعشار فارسی */
function parseNum(v){const n=parseFloat(toLatin(v).replace(/[٫,،]/g,'.'));return isFinite(n)?n:0;}
const pInt=(v,max=1e6)=>Math.max(0,Math.min(max,Math.round(parseNum(v))||0));
function numField(inp,decimal){
  inp.addEventListener('input',()=>{
    let v=toLatin(inp.value).replace(decimal?/[^\d.٫,،]/g:/\D/g,'');
    if(decimal){v=v.replace(/[٫,،]/g,'.');const q=v.split('.');if(q.length>2)v=q[0]+'.'+q.slice(1).join('');}
    inp.value=fa(v).replace('.','٫');
  });
  return inp;
}
/* تاریخ ناممکن (مثل ۳۱ فوریه یا ۳۰ فوریه) به آخرین روز همان ماه می‌رود؛ فرمت نادرست null برمی‌گرداند */
function fixISO(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||''));
  if(!m)return null;
  const y=+m[1],mo=+m[2];let d=+m[3];
  if(mo<1||mo>12||d<1||y<1000)return null;
  const len=new Date(Date.UTC(y,mo,0)).getUTCDate();
  if(d>len)d=len;
  return `${m[1]}-${m[2]}-${pad(d)}`;
}
/* شناسه‌ی دسته: حروف و عدد و _ و -؛ نام‌هایی مثل constructor یا __proto__ که با ویژگی‌های خود شیء قاطی می‌شوند ممنوع‌اند */
const okId=v=>/^[\w-]{1,40}$/.test(String(v))&&!(String(v) in Object.prototype);
const catId=v=>okId(v)?String(v):'other';
function cleanCats(arr){
  const out=[],seen=new Set();
  if(Array.isArray(arr))for(const x of arr){
    if(!x||typeof x!=='object')continue;
    const id=String(x.id||'');
    const name=String(x.name||'').trim().slice(0,30);
    if(!okId(id)||seen.has(id)||!name)continue;
    seen.add(id);
    out.push({id,name,
      icon:Array.from(String(x.icon||'').trim()).slice(0,4).join('')||'✨',
      color:/^#[0-9a-f]{6}$/i.test(String(x.color))?String(x.color):'#64748b',
      kind:hasKey(KINDS,x.kind)?x.kind:((DEFAULT_CATS.find(d=>d.id===id)||{}).kind||'generic')});
    if(out.length>=40)break;
  }
  if(!out.length)return DEFAULT_CATS.map(c=>({...c}));
  if(!seen.has('other'))out.push({...DEFAULT_CATS.find(c=>c.id==='other')});
  return out;
}
/* آیتم‌ها و موارد «بعداً» که به دسته‌ی ناموجود اشاره می‌کنند به «سایر» می‌روند */
function fixCatRefs(st){
  const ok=new Set(st.cats.map(c=>c.id));
  st.items.forEach(i=>{if(!ok.has(i.cat))i.cat='other';});
  st.wish.forEach(w=>{if(!ok.has(w.cat))w.cat='other';});
}
function cleanItem(x){
  if(!x||typeof x!=='object')return null;
  const title=String(x.title||'').trim().slice(0,200);
  if(!title)return null;
  let r=Math.round(Number(x.rating)*2)/2;
  if(!(r>=0.5&&r<=5))r=0;
  let cur=pInt(x.cur);const total=pInt(x.total);
  if(total&&cur>total)cur=total;
  return {
    id:String(x.id||uid()),title,
    cat:catId(x.cat),
    rating:r,
    notes:String(x.notes||'').slice(0,5000),
    date:fixISO(x.date)||todayISO(),
    tags:cleanTags(x.tags),
    creator:String(x.creator||'').slice(0,120),
    status:STATUS[x.status]?x.status:'done',
    fav:!!x.fav,
    link:safeUrl(x.link),
    cur,total,
    hours:Math.max(0,Math.min(99999,Math.round(parseNum(x.hours)*10)/10)),
    season:pInt(x.season,999),
    place:String(x.place||'').trim().slice(0,120),
    times:Math.max(1,Math.min(999,Math.round(parseNum(x.times))||1)),
    created:Number(x.created)||Date.now(),
    demo:!!x.demo
  };
}
function cleanWish(x){
  if(!x||typeof x!=='object')return null;
  const title=String(x.title||'').trim().slice(0,200);
  if(!title)return null;
  return {
    id:String(x.id||uid()),title,
    cat:catId(x.cat),
    note:String(x.note||'').slice(0,500),
    priority:PRIO_W[x.priority]?x.priority:'mid',
    link:safeUrl(x.link),
    source:String(x.source||'').trim().slice(0,120),
    dur:hasKey(DURS,x.dur)?x.dur:'',
    tags:cleanTags(x.tags),
    added:Number(x.added)||Date.now(),
    order:Number(x.order)||Number(x.added)||Date.now(),
    demo:!!x.demo
  };
}
/* اهداف جدا برای هر تقویم: {jalali:{1405:{book:24}}, gregorian:{2026:{book:20}}}
   فرمت قدیمی ({سال:{دسته:عدد}}) هم خوانده و مهاجرت داده می‌شود */
function cleanGoals(g){
  const out={jalali:{},gregorian:{}};
  if(!g||typeof g!=='object')return out;
  const add=(cal,y,obj)=>{
    if(!/^\d{3,4}$/.test(y)||!obj||typeof obj!=='object')return;
    for(const c in obj){
      const n=Math.max(0,Math.min(9999,parseInt(toLatin(obj[c]),10)||0));
      if(okId(c)&&n)(out[cal][y]=out[cal][y]||{})[c]=n;
    }
  };
  for(const k in g){
    if((k==='jalali'||k==='gregorian')&&g[k]&&typeof g[k]==='object'){for(const y in g[k])add(k,y,g[k][y]);}
    else add(+k>1700?'gregorian':'jalali',k,g[k]);
  }
  return out;
}
const hasGoals=g=>['jalali','gregorian'].some(c=>g[c]&&Object.keys(g[c]).length);
/* شناسه‌ها باید یکتا باشند؛ اگر در فایل یا داده‌ی ذخیره‌شده تکرار شده بود، تکراری‌ها شناسه‌ی تازه می‌گیرند */
function uniqueIds(list){
  const seen=new Set();
  list.forEach(x=>{if(seen.has(x.id))x.id=uid();seen.add(x.id);});
  return list;
}
function normalizeState(o){
  const s=emptyState();
  if(o&&typeof o==='object'){
    if(Array.isArray(o.cats))s.cats=cleanCats(o.cats);
    if(Array.isArray(o.items))s.items=uniqueIds(o.items.map(cleanItem).filter(Boolean));
    if(Array.isArray(o.wish))s.wish=uniqueIds(o.wish.map(cleanWish).filter(Boolean));
    s.goals=cleanGoals(o.goals);
    const t=o.settings;
    if(t&&typeof t==='object'){
      if(['auto','light','dark'].includes(t.theme))s.settings.theme=t.theme;
      if(['jalali','gregorian'].includes(t.cal))s.settings.cal=t.cal;
      s.settings.seeded=!!t.seeded;
      s.settings.lastExport=Number(t.lastExport)||0;
      s.settings.hideFileWarn=!!t.hideFileWarn;
    }
  }
  applyCats(s.cats);
  fixCatRefs(s);
  return s;
}
/* نسخه‌ی خراب‌شده‌ی داده کنار می‌ماند (به‌جای اینکه با اولین ذخیره روی آن نوشته شود) */
const DAMAGED=KEY+'-damaged-';
function damagedKeys(){try{return Object.keys(localStorage).filter(k=>k.startsWith(DAMAGED)).sort();}catch(e){return [];}}
function stashDamaged(raw){
  try{
    const ks=damagedKeys();
    while(ks.length>=3)localStorage.removeItem(ks.shift());
    localStorage.setItem(DAMAGED+Date.now(),raw);
  }catch(e){}
}
let lastRaw=null;   // آخرین متنی که از حافظه خوانده یا در آن نوشته‌ایم (برای تشخیص تغییر از تب دیگر)
function loadState(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){memoryOnly=true;return emptyState();}
  lastRaw=raw;
  if(raw){
    try{
      const o=JSON.parse(raw);
      if(!o||typeof o!=='object')throw new Error('bad data');
      return normalizeState(o);
    }catch(e){stashDamaged(raw);}
  }
  return emptyState();
}
let S=loadState();
const idsOf=st=>({items:new Set(st.items.map(x=>x.id)),wish:new Set(st.wish.map(x=>x.id)),cats:new Set(st.cats.map(x=>x.id))});
let base=idsOf(S);  // شناسه‌ها در آخرین همگام‌شدن با حافظه
/* اگر تب دیگری بعد از آخرین خواندنِ ما چیزی نوشته باشد، تغییراتش را قبل از ذخیره با داده‌ی خودمان ادغام می‌کنیم:
   موارد تازه‌ی آن تب اضافه و موارد حذف‌شده‌ی آن تب حذف می‌شوند؛ ویرایش‌های همین تب مقدم است. */
function mergeExternal(raw){
  let O;
  try{O=normalizeState(JSON.parse(raw));}catch(e){applyCats(S.cats);return;}
  const merge=(key)=>{
    const mine=new Set(S[key].map(x=>x.id)),theirs=new Set(O[key].map(x=>x.id));
    O[key].forEach(x=>{if(!mine.has(x.id)&&!base[key].has(x.id))S[key].push(x);});
    if(key!=='cats')S[key]=S[key].filter(x=>!(base[key].has(x.id)&&!theirs.has(x.id)));
  };
  ['items','wish','cats'].forEach(merge);
  applyCats(S.cats);fixCatRefs(S);
}
function save(){
  try{
    const cur=localStorage.getItem(KEY);
    if(cur&&cur!==lastRaw)mergeExternal(cur);
    const out=JSON.stringify(S);
    localStorage.setItem(KEY,out);
    lastRaw=out;base=idsOf(S);
    memoryOnly=false;   // ذخیره کار کرد؛ هشدار «ذخیره‌سازی ممکن نیست» دیگر لازم نیست
  }catch(e){
    if(!memoryOnly){memoryOnly=true;toast('ذخیره در مرورگر ممکن نیست؛ حتماً خروجی بگیر.');}
  }
}
/* تب یا پنجره‌ی دیگری داده را عوض کرد: همین‌جا هم تازه‌اش کن تا بعداً رویش ننویسیم */
window.addEventListener('storage',e=>{
  if(e.storageArea!==localStorage||e.key!==KEY||!e.newValue)return;
  try{S=normalizeState(JSON.parse(e.newValue));}catch(err){applyCats(S.cats);return;}
  lastRaw=e.newValue;base=idsOf(S);
  const a=document.activeElement;
  const typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.closest('#app');   // وسط نوشتن، صفحه را از نو نساز
  if(!document.querySelector('dialog[open]')&&!typing)render();
});

let toastTimer;
function toast(msg,action){
  const t=$('#toast');
  t.classList.remove('show');
  const parts=[h('span',{text:msg})];
  if(action)parts.push(h('button',{type:'button',class:'toast-act',text:action.label,onclick:()=>{action.fn();t.classList.remove('show');}}));
  t.replaceChildren(...parts);
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),action?7000:3200);
}
function openDialog(node,cls){
  const d=h('dialog',{class:'dlg '+(cls||'')},node);
  let down=null;
  d.addEventListener('mousedown',e=>{down=e.target;});
  d.addEventListener('click',e=>{if(e.target===d&&down===d)d.close();});
  d.addEventListener('close',()=>d.remove());
  document.body.append(d);
  d.showModal();
  return d;
}
function askConfirm(msg,ok,danger=true){
  return new Promise(resolve=>{
    let result=false;
    const body=h('div',{class:'dlg-body'},
      h('p',{text:msg}),
      h('div',{class:'dlg-actions'},
        h('button',{class:'btn ghost',type:'button',text:'انصراف',onclick:()=>d.close()}),
        h('button',{class:'btn '+(danger?'danger':'primary'),type:'button',text:ok||'حذف',onclick:()=>{result=true;d.close();}})
      ));
    const d=openDialog(body,'');
    d.addEventListener('close',()=>resolve(result));
  });
}

function stars(v,big){
  const s=h('span',{class:'stars'+(big?' big':''),role:'img','aria-label':v?`امتیاز ${fmtR(v)} از ۵`:'بدون امتیاز'});
  s.append(h('span',{class:'bg','aria-hidden':'true',text:'★★★★★'}),
           h('span',{class:'fg','aria-hidden':'true',style:`width:${(v/5)*100}%`,text:'★★★★★'}));
  return s;
}
function ratingInput(initial,compact){
  let val=initial||0;
  const bg=h('span',{class:'bg','aria-hidden':'true',text:'★★★★★'});
  const fg=h('span',{class:'fg','aria-hidden':'true',text:'★★★★★'});
  const box=h('div',{class:'stars '+(compact?'mid':'big'),role:'slider',tabindex:'0','aria-valuemin':'0','aria-valuemax':'5','aria-label':'امتیاز از ۱ تا ۵ (نیم‌ستاره هم مجاز است)'},bg,fg);
  const label=h('span',{class:'muted'});
  const clear=h('button',{type:'button',class:'btn ghost sm',text:'بدون امتیاز',onclick:()=>{val=0;paint();}});
  function paint(){
    fg.style.width=(val/5*100)+'%';
    box.setAttribute('aria-valuenow',String(val));
    label.textContent=val?`${fmtR(val)} از ۵`:'امتیازی داده نشده';
    clear.hidden=!val;
  }
  box.addEventListener('click',e=>{
    const r=box.getBoundingClientRect();
    const frac=(r.right-e.clientX)/r.width;
    /* روی صفحه‌ی لمسی، ستاره‌های ثبت سریع (کوچک) فقط کامل‌اند؛ نیم‌ستاره را در فرم کامل بزن */
    const nv=(compact&&COARSE)?Math.min(5,Math.max(1,Math.ceil(frac*5))):Math.min(5,Math.max(0.5,Math.ceil(frac*10)/2));
    val=(compact&&nv===val)?0:nv;   // در حالت فشرده کلیک دوباره روی همان مقدار، امتیاز را پاک می‌کند
    paint();
  });
  box.addEventListener('keydown',e=>{
    let used=true;
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')val=Math.min(5,val+0.5);
    else if(e.key==='ArrowRight'||e.key==='ArrowDown')val=Math.max(0,val-0.5);
    else if(/^[1-5]$/.test(e.key))val=+e.key;
    else if(e.key==='0'||e.key==='Backspace'||e.key==='Delete')val=0;
    else used=false;
    if(used){e.preventDefault();paint();}
  });
  paint();
  return {el:compact?box:h('div',{class:'rate'},box,label,clear),get:()=>val,reset:()=>{val=0;paint();}};
}
function datePicker(iso){
  const c=toCal(iso);
  const ys=h('select',{'aria-label':'سال'}),ms=h('select',{'aria-label':'ماه'}),ds=h('select',{'aria-label':'روز'});
  const cy=curYear(),years=[];
  for(let k=cy+1;k>=cy-40;k--)years.push(k);
  if(!years.includes(c.y)){years.push(c.y);years.sort((a,b)=>b-a);}
  years.forEach(k=>ys.append(h('option',{value:String(k),text:fa(k)})));
  monthNames().forEach((n,k)=>ms.append(h('option',{value:String(k+1),text:n})));
  function fillDays(){
    const len=monthLen(+ys.value,+ms.value);
    const keep=Math.min(+ds.value||c.d,len);
    ds.replaceChildren();
    for(let k=1;k<=len;k++)ds.append(h('option',{value:String(k),text:fa(k)}));
    ds.value=String(keep);
  }
  ys.value=String(c.y);ms.value=String(c.m);fillDays();ds.value=String(c.d);
  ys.addEventListener('change',fillDays);
  ms.addEventListener('change',fillDays);
  return {el:h('div',{class:'datepick'},ds,ms,ys),get:()=>fromCal(+ys.value,+ms.value,+ds.value)};
}

const tkey=t=>norm(String(t)).replace(/\s+/g,' ').trim();
/* آخرین ثبتِ هم‌عنوان در دفتر + تعداد دفعات */
function historyMatch(title){
  const k=tkey(title);
  if(!k)return null;
  let best=null,count=0,mt=1;
  for(const i of S.items){
    if(tkey(i.title)!==k)continue;
    count++;mt=Math.max(mt,i.times||1);
    if(!best||i.date>best.date||(i.date===best.date&&i.created>best.created))best=i;
  }
  return best?{item:best,count,next:Math.max(mt,count)+1}:null;
}
function topTags(n){
  const c=Object.create(null);
  S.items.forEach(i=>i.tags.forEach(t=>{c[t]=(c[t]||0)+1;}));
  return Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'fa')).slice(0,n).map(x=>x[0]);
}
/* فهرست‌های پیشنهاد مرورگر برای عنوان و سازنده */
function renderDatalists(){
  const fill=(id,vals)=>{const el=document.getElementById(id);if(el)el.replaceChildren(...vals.map(v=>h('option',{value:v})));};
  const titles=new Set(),cre=new Set();
  S.items.forEach(i=>{titles.add(i.title);if(i.creator)cre.add(i.creator);});
  S.wish.forEach(w=>titles.add(w.title));
  fill('dlTitles',[...titles].slice(-400));
  fill('dlCreators',[...cre].slice(-400));
}
/* اگر مورد هم‌عنوان و هم‌دسته در لیست «بعداً» باشد، با ثبت از آن برداشته می‌شود */
/* یادداشت و منبعِ مورد «بعداً» وقتی به دفتر می‌رود دور ریخته نشود: در توضیح می‌آید */
const wishNotes=w=>[w.note,w.source?`منبع: ${w.source}`:''].filter(Boolean).join('\n');
function removeMatchingWish(rec){
  const k=tkey(rec.title);
  const w=S.wish.find(x=>tkey(x.title)===k&&x.cat===rec.cat);
  if(!w)return null;
  if(!rec.notes)rec.notes=wishNotes(w).slice(0,5000);
  S.wish=S.wish.filter(x=>x!==w);
  if(UI.pick===w.id)UI.pick=null;
  return w;
}
const catOptions=()=>CATS.map(c=>[c.id,c.icon+' '+c.name]);
/* انتخاب دسته؛ با گزینه‌ی «دسته‌ی جدید» می‌شود همان‌جا دسته ساخت */
function makeCatSelect(value,onChange,withNew,props){
  let prev=CAT[value]?value:CATS[0].id;
  const s=select(catOptions(),prev,null,props);
  const newOpt=()=>h('option',{value:'__new',text:'＋ دسته‌ی جدید…'});
  if(withNew)s.append(newOpt());
  s.addEventListener('change',()=>{
    if(s.value==='__new'){
      s.value=prev;
      openCatForm(null,cat=>{
        s.replaceChildren(...catOptions().map(([v,t])=>h('option',{value:v,text:t})),newOpt());
        s.value=cat.id;prev=cat.id;
        if(onChange)onChange(cat.id);
      });
      return;
    }
    prev=s.value;
    if(onChange)onChange(s.value);
  });
  return s;
}

function openCatForm(cat,onSaved){
  const name=h('input',{type:'text',maxlength:'30',value:cat?cat.name:'',placeholder:'مثلاً: ورزش، نمایشگاه، وبینار',autocomplete:'off','aria-label':'نام دسته'});

  const color=h('input',{type:'color',value:cat?cat.color:COLORS[(S.cats.length)%COLORS.length],'aria-label':'رنگ'});
  const kind=select(Object.entries(KINDS).map(([k,v])=>[k,v.name]),cat&&hasKey(KINDS,cat.kind)?cat.kind:'generic',null,{'aria-label':'نوع دسته'});

    const nm=name.value.trim();

    if(cat){Object.assign(cat,{name:nm,icon:ic,color:color.value,kind:kind.value});rec=cat;}
    else{rec={id:'c'+uid(),name:nm,icon:ic,color:color.value,kind:kind.value};S.cats.push(rec);}
    applyCats(S.cats);
    save();dlg.close();
    if(onSaved)onSaved(rec);
    toast(cat?'دسته ذخیره شد':'دسته‌ی جدید ساخته شد ✓');
  };
  [name,icon].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSave();}}));
  const body=h('div',{class:'dlg-body'},
    h('h2',{text:cat?'ویرایش دسته':'دسته‌ی جدید'}),
    h('label',{class:'fld'},h('span',{text:'نام'}),name,err),
    h('div',{class:'fld',role:'group','aria-label':'ایموجی'},h('span',{text:'ایموجی (از لیست انتخاب کن یا خودت بنویس)'}),
      h('div',{class:'qa-row'},icon),
      h('div',{class:'emoji-grid'},EMOJIS.map(e=>h('button',{type:'button',text:e,'aria-label':'انتخاب '+e,onclick:()=>{icon.value=e;}})))),
    h('label',{class:'fld'},h('span',{text:'نوع (تعیین می‌کند چه فیلدهای اضافه‌ای داشته باشد: صفحه، قسمت، ساعت، مکان…)'}),kind),
    h('div',{class:'fld',role:'group','aria-label':'رنگ'},h('span',{text:'رنگ'}),
      h('div',{class:'swatches'},color,COLORS.map(c=>h('button',{type:'button','aria-label':'رنگ '+c,style:`background:${c}`,onclick:()=>{color.value=c;}})))),
    h('div',{class:'dlg-actions'},
      h('button',{type:'button',class:'btn ghost',text:'انصراف',onclick:()=>dlg.close()}),
      h('button',{type:'button',class:'btn primary',text:'ذخیره',onclick:doSave})));
  const dlg=openDialog(body,'');
  name.focus();
}
function moveCat(id,dir){
  const k=S.cats.findIndex(c=>c.id===id),n=k+dir;
  if(k<0||n<0||n>=S.cats.length)return;
  [S.cats[k],S.cats[n]]=[S.cats[n],S.cats[k]];
  applyCats(S.cats);save();render();
}
async function deleteCat(c){
  const ni=S.items.filter(i=>i.cat===c.id).length,nw=S.wish.filter(w=>w.cat===c.id).length;
  const msg=`دسته‌ی «${c.name}» حذف شود؟`+((ni||nw)?` ${fa(ni)} مورد دفتر و ${fa(nw)} مورد لیست «بعداً» به «سایر» منتقل می‌شوند.`:'');
  if(!(await askConfirm(msg)))return;
  S.items.forEach(i=>{if(i.cat===c.id)i.cat='other';});
  S.wish.forEach(w=>{if(w.cat===c.id)w.cat='other';});
  for(const cal in S.goals)for(const y in S.goals[cal]){
    delete S.goals[cal][y][c.id];
    if(!Object.keys(S.goals[cal][y]).length)delete S.goals[cal][y];
  }
  S.cats=S.cats.filter(x=>x.id!==c.id);
  applyCats(S.cats);
  if(UI.filters.cat===c.id)UI.filters.cat='';
  if(UI.wishCat===c.id)UI.wishCat='';
  if(UI.pickCat===c.id)UI.pickCat='';
  if(UI.lastCat===c.id)UI.lastCat='other';
  if(UI.lastWishCat===c.id)UI.lastWishCat='other';
  save();render();toast('دسته حذف شد');
}

/* ---------- مدیریت تگ‌ها ---------- */
const tagKey=t=>tkey(t).replace(/[\s‌‍\-_#]/g,'');
function tagStats(){
  const m=new Map();
  const add=(t,k)=>{const e=m.get(t)||{items:0,wish:0};e[k]++;m.set(t,e);};
  S.items.forEach(i=>i.tags.forEach(t=>add(t,'items')));
  S.wish.forEach(w=>w.tags.forEach(t=>add(t,'wish')));
  return m;
}
/* تغییر نام؛ اگر نام جدید از قبل باشد دو تگ ادغام می‌شوند */
function renameTag(from,to){
  to=cleanTags([to])[0];
  if(!to||to===from)return 0;
  let n=0;
  const fix=a=>{if(a.tags.includes(from)){a.tags=cleanTags(a.tags.map(t=>t===from?to:t));n++;}};
  S.items.forEach(fix);S.wish.forEach(fix);
  if(UI.filters.tag===from)UI.filters.tag=to;
  if(UI.wishTag===from)UI.wishTag=to;
  save();
  return n;
}
function removeTag(t){
  let n=0;
  const fix=a=>{if(a.tags.includes(t)){a.tags=a.tags.filter(x=>x!==t);n++;}};
  S.items.forEach(fix);S.wish.forEach(fix);
  if(UI.filters.tag===t)UI.filters.tag='';
  if(UI.wishTag===t)UI.wishTag='';
  save();
  return n;
}
function openTagRename(t,stats){
  const input=h('input',{type:'text',maxlength:'30',value:t,autocomplete:'off','aria-label':'نام جدید تگ'});
  const info=h('p',{class:'hint',hidden:true});
  input.addEventListener('input',()=>{
    const nv=cleanTags([input.value])[0];
    if(nv&&nv!==t&&stats.has(nv)){info.textContent=`«${nv}» از قبل هست؛ دو تگ ادغام می‌شوند.`;info.hidden=false;}
    else info.hidden=true;
  });
  const doIt=()=>{
    const nv=cleanTags([input.value])[0];
    if(!nv){input.focus();return;}
    if(nv===t){dlg.close();return;}
    const merged=stats.has(nv);
    const n=renameTag(t,nv);
    dlg.close();render();
    toast(merged?`ادغام شد: ${fa(n)} مورد به «${nv}» رفت`:`نام تگ عوض شد (${fa(n)} مورد)`);
  };
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doIt();}});
  const body=h('div',{class:'dlg-body'},
    h('h2',{text:'تغییر نام / ادغام تگ'}),
    h('p',{class:'muted',style:'font-size:.9rem',text:'اگر نام یک تگ موجود را بنویسی، دو تگ در هم ادغام می‌شوند.'}),
    h('label',{class:'fld'},h('span',{text:'نام تگ'}),input),
    info,
    h('div',{class:'dlg-actions'},
      h('button',{type:'button',class:'btn ghost',text:'انصراف',onclick:()=>dlg.close()}),
      h('button',{type:'button',class:'btn primary',text:'ذخیره',onclick:doIt})));
  const dlg=openDialog(body,'');
  input.focus();input.select();
}
async function deleteTagUI(t,e){
  const n=e.items+e.wish;
  if(!(await askConfirm(`تگ «${t}» از ${fa(n)} مورد برداشته شود؟ خود موارد پاک نمی‌شوند.`,'برداشتن')))return;
  removeTag(t);render();toast('تگ حذف شد');
}
function tagSection(){
  const stats=tagStats();
  const sec=section('تگ‌ها');
  if(!stats.size){
    sec.append(h('p',{class:'muted',text:'هنوز تگی ثبت نشده. موقع ثبت هر مورد می‌توانی تگ بگذاری.'}));
    return sec;
  }
  sec.append(h('p',{class:'muted',style:'margin-bottom:8px;font-size:.92rem',text:'نام تگ‌ها را عوض کن، تگ‌های تکراری را ادغام کن یا تگ را از همه‌ی موارد بردار.'}));
  const cnt=t=>stats.get(t).items+stats.get(t).wish;
  /* پیشنهاد ادغام: تگ‌هایی که جز فاصله/نیم‌فاصله/حروف عربی-فارسی یکی‌اند */
  const groups=new Map();
  for(const t of stats.keys()){
    const k=tagKey(t);if(!k)continue;
    if(!groups.has(k))groups.set(k,[]);
    groups.get(k).push(t);
  }
  const dups=[...groups.values()].filter(g=>g.length>1);
  if(dups.length){
    sec.append(h('div',{class:'banner',style:'display:grid;margin-bottom:10px'},
      h('strong',{text:'🔀 پیشنهاد ادغام'}),
      dups.map(g=>{
        /* ترجیح: بیشترین استفاده در دفتر، بعد کل استفاده، بعد نسخه‌ی با نیم‌فاصله (املای درست فارسی) */
        const zw=t=>t.includes('\u200c')?1:0;
        const best=[...g].sort((a,b)=>stats.get(b).items-stats.get(a).items||cnt(b)-cnt(a)||zw(b)-zw(a)||a.localeCompare(b,'fa'))[0];
        return h('div',{class:'sug-row'},
          h('span',{text:g.map(t=>'«'+t+'»').join('، ')+' شبیه هم‌اند'}),
          h('button',{class:'btn sm primary',type:'button',text:`ادغام در «${best}»`,onclick:()=>{
            let n=0;g.forEach(t=>{if(t!==best)n+=renameTag(t,best);});
            render();toast(`ادغام شد (${fa(n)} مورد)`);
          }}));
      })));
  }
  const q=h('input',{type:'search',placeholder:'جستجوی تگ…','aria-label':'جستجوی تگ‌ها',autocomplete:'off'});
  const list=h('div');
  const refresh=()=>{
    const k=tkey(q.value);
    const all=[...stats.entries()].filter(([t])=>!k||tkey(t).includes(k))
      .sort((a,b)=>(b[1].items+b[1].wish)-(a[1].items+a[1].wish)||a[0].localeCompare(b[0],'fa'));
    const rows=all.slice(0,60).map(([t,e])=>h('div',{class:'tag-row'},
      h('span',{class:'tn',text:'#'+t}),
      h('span',{class:'muted',style:'font-size:.84rem',text:`${fa(e.items)} مورد`+(e.wish?` · ${fa(e.wish)} در بعداً`:'')}),
      h('button',{class:'icon-btn',type:'button','aria-label':'تغییر نام یا ادغام '+t,title:'تغییر نام / ادغام',text:'✏️',onclick:()=>openTagRename(t,stats)}),
      h('button',{class:'icon-btn',type:'button','aria-label':'حذف تگ '+t,title:'حذف',text:'🗑️',onclick:()=>deleteTagUI(t,e)})));
    if(all.length>60)rows.push(h('p',{class:'muted',text:`${fa(all.length-60)} تگ دیگر هم هست؛ برای پیدا کردنشان جستجو کن.`}));
    if(!all.length)rows.push(h('p',{class:'muted',text:'تگی پیدا نشد.'}));
    list.replaceChildren(...rows);
  };
  q.addEventListener('input',refresh);
  sec.append(h('div',{style:'margin-bottom:8px'},q),list);
  refresh();
  return sec;
}

/* ثبت سریع: فقط عنوان + دسته + ستاره، با یک Enter */
function quickBar(){
  let catTouched=false;
  const title=h('input',{type:'text',id:'qTitle',maxlength:'200','aria-label':'ثبت سریع',placeholder:'ثبت سریع: اسم چیزی که انجام دادی…',autocomplete:'off',enterkeyhint:'done'});
  const cat=makeCatSelect(UI.lastCat,v=>{UI.lastCat=v;catTouched=true;},true,{'aria-label':'دسته'});
  const rating=ratingInput(0,true);
  const hint=h('p',{class:'hint',hidden:true});
  function fill(){
    const m=historyMatch(title.value);
    if(!m){hint.hidden=true;return null;}
    if(!catTouched&&CAT[m.item.cat]){cat.value=m.item.cat;UI.lastCat=m.item.cat;}
    hint.textContent=`🔁 قبلاً ${fa(m.count)} بار ثبت شده؛ سازنده و تگ‌ها از همان پر می‌شود.`;
    hint.hidden=false;
    return m;
  }
  const add=()=>{
    const t=title.value.trim();
    if(!t){title.focus();return;}
    const m=fill();
    const same=m&&m.item.cat===cat.value;
    const rec=cleanItem({id:uid(),title:t,cat:cat.value,rating:rating.get(),date:todayISO(),status:'done',
      creator:same?m.item.creator:'',tags:same?m.item.tags:[],total:same?m.item.total:0,times:m?m.next:1,created:Date.now()});
    S.items.push(rec);
    const removed=removeMatchingWish(rec);
    UI.lastCat=rec.cat;UI.year=yearOf(rec.date);UI.filters=defaultFilters();
    save();render();
    const q=$('#qTitle');if(q)q.focus();
    toast(removed?'ثبت شد ✓ — از «بعداً» هم برداشته شد':'ثبت شد ✓',{label:'تکمیل جزئیات',fn:()=>openItemForm(rec)});
  };
  title.addEventListener('change',fill);
  title.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add();}});
  return h('div',{class:'card quick-add'},
    h('div',{class:'qa-row'},title),
    hint,
    h('div',{class:'qa-row'},cat,rating.el,
      h('button',{class:'btn primary',type:'button',text:'＋ ثبت',onclick:add}),
      h('button',{class:'btn ghost',type:'button',text:'جزئیات…',onclick:()=>openItemForm(null,{prefill:{title:title.value.trim(),cat:cat.value,rating:rating.get()}})})));
}

function openItemForm(item,opts){
  opts=opts||{};
  const base={title:'',cat:(CAT[UI.lastCat]?UI.lastCat:CATS[0].id),rating:0,notes:'',date:todayISO(),tags:[],creator:'',status:'done',fav:false,link:''};
  const d0={...base,...(item||{}),...(opts.prefill||{})};
  if(!CAT[d0.cat])d0.cat='other';
  const titleIn=h('input',{type:'text',maxlength:'200',value:d0.title,placeholder:'مثلاً: اینترستلار، سووشون، دوره‌ی پایتون',autocomplete:'off',list:'dlTitles'});
  const err=h('p',{class:'err',role:'alert',hidden:true,text:'عنوان را بنویس.'});
  let catTouched=!!item||!!(opts.prefill&&opts.prefill.cat);
  const catSel=makeCatSelect(d0.cat,()=>{catTouched=true;syncKind();},true);
  const statusSel=select(Object.entries(STATUS),d0.status);
  const rating=ratingInput(d0.rating);
  const date=datePicker(d0.date);
  const creatorIn=h('input',{type:'text',maxlength:'120',value:d0.creator,placeholder:'کارگردان، نویسنده، پلتفرم…',autocomplete:'off',list:'dlCreators'});
  const tagsIn=h('input',{type:'text',value:d0.tags.join('، '),placeholder:'با ویرگول جدا کن: درام، تکرارشدنی'});
  const linkIn=h('input',{type:'text',class:'ltr',inputmode:'url',value:d0.link,placeholder:'https://…',autocomplete:'off'});
  const linkErr=h('p',{class:'err',hidden:true,text:'این لینک معتبر نیست (فقط http و https).'});
  const notes=h('textarea',{maxlength:'5000',placeholder:'نظر و احساس شخصی‌ات…'});
  notes.value=d0.notes;
  const favIn=h('input',{type:'checkbox',checked:!!d0.fav});

  /* فیلدهای اضافه بر اساس نوع دسته */
  const mkNum=(v,dec)=>numField(h('input',{type:'text',inputmode:dec?'decimal':'numeric',maxlength:'7',autocomplete:'off',value:v?(dec?fmtR(v):fa(v)):''}),dec);
  const curIn=mkNum(d0.cur),totalIn=mkNum(d0.total),seasonIn=mkNum(d0.season),hoursIn=mkNum(d0.hours,true),timesIn=mkNum(d0.times>1?d0.times:1);
  const placeIn=h('input',{type:'text',maxlength:'120',value:d0.place,autocomplete:'off'});
  const creatorLbl=h('span'),lCur=h('span'),lTotal=h('span'),lHours=h('span');
  const wSeason=h('label',{class:'fld'},h('span',{text:'فصل'}),seasonIn);
  const wCur=h('label',{class:'fld'},lCur,curIn);
  const wTotal=h('label',{class:'fld'},lTotal,totalIn);
  const wHours=h('label',{class:'fld'},lHours,hoursIn);
  const wPlace=h('label',{class:'fld'},h('span',{text:'مکان / شهر'}),placeIn);
  const wTimes=h('label',{class:'fld'},h('span',{text:'چندمین بار؟ (۱ = اولین بار)'}),timesIn);
  function syncKind(){
    const k=kindOf(catSel.value);
    creatorLbl.textContent=k.creator;
    creatorIn.placeholder=k.creator+' (اختیاری)';
    wSeason.hidden=!k.season;
    wCur.hidden=wTotal.hidden=!k.unit;
    lCur.textContent=k.unit?k.unit+' فعلی':'';
    lTotal.textContent=k.unit?'کل '+k.unit:'';
    wHours.hidden=!k.hours;lHours.textContent=k.hours||'';
    wPlace.hidden=!k.place;
  }

  /* پیشنهاد تگ‌های پرکاربرد (با یک کلیک اضافه می‌شوند) */
  const tagSug=h('div',{class:'tagsug','aria-label':'تگ‌های پرکاربرد'});
  function renderTagSug(){
    const cur=new Set(cleanTags(tagsIn.value));
    tagSug.replaceChildren(...topTags(12).filter(t=>!cur.has(t)).map(t=>h('button',{type:'button',class:'tag',text:'+ '+t,onclick:()=>{
      tagsIn.value=cleanTags([...cleanTags(tagsIn.value),t]).join('، ');
      renderTagSug();
    }})));
  }
  tagsIn.addEventListener('input',renderTagSug);
  /* پر کردن خودکار از سابقه: اگر عنوان قبلاً ثبت شده، دسته/سازنده/تگ را پیشنهاد بده */
  const hint=h('p',{class:'hint',hidden:true});
  function autofill(){
    if(item)return;
    const t=titleIn.value.trim();
    const m=historyMatch(t);
    const inWish=t&&S.wish.some(w=>tkey(w.title)===tkey(t));
    const msgs=[];
    if(m){
      if(!catTouched&&CAT[m.item.cat]){catSel.value=m.item.cat;syncKind();}
      if(!creatorIn.value.trim()&&m.item.creator)creatorIn.value=m.item.creator;
      if(m.item.cat===catSel.value&&m.item.total&&!totalIn.value)totalIn.value=fa(m.item.total);
      if(parseNum(timesIn.value)<=1)timesIn.value=fa(m.next);
      if(!tagsIn.value.trim()&&m.item.tags.length){tagsIn.value=m.item.tags.join('، ');renderTagSug();}
      msgs.push(`🔁 قبلاً ${fa(m.count)} بار ثبت شده؛ سازنده و تگ‌ها از همان پر شد و «چندمین بار» روی ${fa(m.next)} رفت.`);
    }
    if(inWish&&!opts.wishId)msgs.push('🔖 در لیست «بعداً» هست و با ثبت از آن برداشته می‌شود.');
    hint.textContent=msgs.join(' ');
    hint.hidden=!msgs.length;
  }
  titleIn.addEventListener('change',autofill);

  /* ذخیره مستقیم با کلیک (بدون وابستگی به submit بومی فرم؛ در پیش‌نمایش‌های sandbox‌شده submit مسدود می‌شود) */
  const doSave=()=>{
    const title=titleIn.value.trim();
    err.hidden=!!title;
    if(!title){titleIn.focus();return;}
    const rawLink=linkIn.value.trim(),link=safeUrl(rawLink);
    linkErr.hidden=!(rawLink&&!link);
    if(rawLink&&!link){linkIn.focus();return;}
    const k=kindOf(catSel.value);
    const rec=cleanItem({
      id:item?item.id:uid(),title,cat:catSel.value,
      cur:parseNum(curIn.value),total:parseNum(totalIn.value),   // فیلدهای پنهان‌شده هم نگه داشته می‌شوند تا با عوض کردن دسته گم نشوند
      season:parseNum(seasonIn.value),hours:parseNum(hoursIn.value),
      place:placeIn.value.trim(),times:parseNum(timesIn.value)||1,rating:rating.get(),notes:notes.value.trim(),
      date:date.get(),tags:cleanTags(tagsIn.value),creator:creatorIn.value.trim(),
      status:statusSel.value,fav:favIn.checked,link,
      created:item?item.created:Date.now(),demo:item?item.demo:false
    });
    let autoDone=false;   // پیشرفت به کل رسید ← خودکار «تمام‌شده»
    if(rec.status==='doing'&&k.unit&&rec.total>0&&rec.cur>=rec.total){rec.status='done';autoDone=true;}
    if(item){
      const idx=S.items.findIndex(x=>x.id===item.id);
      if(idx>=0)S.items[idx]=rec;
    }else{
      S.items.push(rec);
      UI.filters=defaultFilters();
    }
    let removed=null;
    if(opts.wishId){
      S.wish=S.wish.filter(w=>w.id!==opts.wishId);
      if(UI.pick===opts.wishId)UI.pick=null;
    }else if(!item)removed=removeMatchingWish(rec);
    UI.lastCat=rec.cat;
    UI.year=yearOf(rec.date);
    save();
    dlg.close();
    render();
    if(opts.wishId)toast('به دفتر اضافه شد 🎉',{label:'دیدن در دفتر',fn:()=>go('journal')});
    else if(removed)toast('ثبت شد ✓ — از «بعداً» هم برداشته شد',{label:'بازگردانی',fn:()=>{S.wish.push(removed);save();render();}});
    else toast((item?'تغییرات ذخیره شد':'ثبت شد ✓')+(autoDone?' — وضعیت: تمام‌شده 🎉':''));
  };
  const form=h('form',{class:'dlg-body form',novalidate:true,onsubmit:e=>{e.preventDefault();doSave();}},
    h('h2',{text:item?'ویرایش مورد':(opts.wishId?'انجامش دادی! 🎉':'ثبت مورد جدید')}),
    h('label',{class:'fld'},h('span',{text:'عنوان *'}),titleIn,err),
    hint,
    h('div',{class:'grid2'},
      h('label',{class:'fld'},h('span',{text:'دسته'}),catSel),
      h('label',{class:'fld'},h('span',{text:'وضعیت'}),statusSel)),
    h('div',{class:'fld',role:'group','aria-label':'امتیاز'},h('span',{text:'امتیاز'}),rating.el),
    h('div',{class:'fld',role:'group','aria-label':'تاریخ انجام'},h('span',{text:'تاریخ انجام'}),date.el),
    h('label',{class:'fld'},h('span',{text:'توضیح / نقد شخصی'}),notes),
    h('div',{class:'grid2'},
      h('label',{class:'fld'},creatorLbl,creatorIn),
      h('label',{class:'fld'},h('span',{text:'تگ‌ها'}),tagsIn,tagSug)),
    h('div',{class:'grid2'},wSeason,wCur,wTotal,wHours,wPlace,wTimes),
    h('label',{class:'fld'},h('span',{text:'لینک (اختیاری)'}),linkIn,linkErr),
    h('label',{class:'chk'},favIn,h('span',{text:'❤️ موردعلاقه'})),
    h('div',{class:'dlg-actions'},
      h('button',{type:'button',class:'btn ghost',text:'انصراف',onclick:()=>dlg.close()}),
      h('button',{type:'button',class:'btn primary',text:'ذخیره',onclick:doSave}))
  );
  [titleIn,creatorIn,tagsIn,linkIn,placeIn].forEach(inp=>inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();doSave();}
  }));
  const dlg=openDialog(form,'wide');
  syncKind();
  renderTagSug();
  autofill();
  if(item&&COARSE){if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();}
  else titleIn.focus();   // روی موبایل هنگام ویرایش، کیبورد خودبه‌خود باز نشود (نیمی از فرم را می‌پوشاند)
}

function clearDemo(){

/* ---------- دفتر ---------- */
function filtered(forceAll){
  const f=UI.filters,q=norm(f.q.trim());
  const a=((forceAll||f.allYears)?S.items:itemsOfYear()).filter(i=>{
    if(f.cat&&i.cat!==f.cat)return false;
    if(f.minRating&&i.rating<f.minRating)return false;
    if(f.status&&i.status!==f.status)return false;
    if(f.tag&&!i.tags.includes(f.tag))return false;
    if(f.month&&toCal(i.date).m!==f.month)return false;
    if(f.fav&&!i.fav)return false;
    if(q&&!norm(i.title+' '+i.notes+' '+i.tags.join(' ')+' '+i.creator+' '+i.place).includes(q))return false;
    return true;
  });
  const by={
    new:(x,y)=>y.date.localeCompare(x.date)||y.created-x.created,
    old:(x,y)=>x.date.localeCompare(y.date)||x.created-y.created,
    rating:(x,y)=>y.rating-x.rating||y.date.localeCompare(x.date),
    alpha:(x,y)=>x.title.localeCompare(y.title,'fa')
  };
  return a.sort(by[f.sort]||by.new);
}
function filtersActive(){
  const f=UI.filters;
  return !!(f.q||f.cat||f.minRating||f.status||f.tag||f.month||f.fav||f.allYears);
}
async function deleteItem(i){
  if(!(await askConfirm(`«${i.title}» حذف شود؟`)))return;
  const copy={...i};
  S.items=S.items.filter(x=>x.id!==i.id);
  save();render();
  toast('حذف شد',{label:'بازگردانی',fn:()=>{S.items.push(copy);save();render();}});
}
/* خلاصه‌ی فیلدهای اضافه برای نمایش روی کارت */
function extraMeta(i){
  const k=kindOf(i.cat),m=[];
  if(k.season&&i.season)m.push(`فصل ${fa(i.season)}`);
  if(k.place&&i.place)m.push('📍 '+i.place);
  if(k.hours&&i.hours)m.push(`⏱️ ${fmtR(i.hours)} ساعت`);
  if(k.unit&&i.status!=='doing'){
    if(i.total&&i.status==='done')m.push(`${fa(i.total)} ${k.unit}`);
    else if(i.cur||i.total)m.push(`${k.unit} ${fa(i.cur)}${i.total?' از '+fa(i.total):''}`);
  }
  if(i.times>1)m.push(`🔁 ${fa(i.times)} بار`);
  return m;
}
/* پیشرفت قابل‌ویرایش برای مواردِ «در حال انجام» (مثلاً صفحه‌ی ۱۲۰ از ۳۰۰) */
function progressBlock(i){
  const k=kindOf(i.cat);
  if(!k.unit||i.status!=='doing')return null;
  const input=numField(h('input',{type:'text',inputmode:'numeric',maxlength:'7',value:i.cur?fa(i.cur):'',placeholder:'۰','aria-label':`${k.unit} فعلی ${i.title}`,autocomplete:'off'}));
  input.addEventListener('change',()=>{
    let v=pInt(input.value);
    if(i.total&&v>i.total)v=i.total;
    i.cur=v;
    const done=!!(i.total&&v>=i.total);
    if(done)i.status='done';
    save();render();
    if(done)toast('تمام شد 🎉 به «تمام‌شده» رفت');
  });
  const pct=i.total?Math.min(100,i.cur/i.total*100):0;
  return h('div',{class:'prog'},
    h('span',{class:'muted',text:k.unit}),input,
    i.total?h('span',{class:'muted',text:`از ${fa(i.total)} (${fa(Math.round(pct))}٪)`}):null,
    i.total?h('div',{class:'bar',style:`--c:${CAT[i.cat].color}`,role:'progressbar','aria-valuemin':'0','aria-valuemax':'100','aria-valuenow':String(Math.round(pct)),'aria-label':'پیشرفت '+i.title},h('i',{style:`width:${pct}%`})):null);
}
function itemCard(i,idx){
  const c=CAT[i.cat];
  const long=i.notes.length>150||i.notes.split('\n').length>3;
  const notesEl=i.notes?h('p',{class:'notes'+(long?' clamp':''),text:i.notes}):null;
  const more=long?h('button',{class:'more',type:'button','aria-expanded':'false',text:'ادامه‌ی نقد',onclick:e=>{
    const open=notesEl.classList.toggle('clamp');
    e.currentTarget.textContent=open?'ادامه‌ی نقد':'کمتر';
    e.currentTarget.setAttribute('aria-expanded',String(!open));
  }}):null;
  return h('article',{class:'card item',style:`--c:${c.color};animation-delay:${Math.min(idx,10)*30}ms`},

function doneFromWish(w){

}
/* «شروع کردم»: مستقیم به دفتر با وضعیت «در حال انجام» می‌رود */
function startFromWish(w){
  const rec=cleanItem({id:uid(),title:w.title,cat:w.cat,status:'doing',date:todayISO(),tags:w.tags,link:w.link,notes:wishNotes(w),created:Date.now()});
  S.items.push(rec);
  S.wish=S.wish.filter(x=>x.id!==w.id);
  if(UI.pick===w.id)UI.pick=null;
  UI.year=yearOf(rec.date);UI.filters=defaultFilters();UI.lastCat=rec.cat;
  save();render();
  toast('▶️ به «در حال انجام» رفت',{label:'دیدن در دفتر',fn:()=>go('journal')});
}
async function deleteWish(w){
  if(!(await askConfirm(`«${w.title}» از لیست حذف شود؟`)))return;
  const copy={...w};
  S.wish=S.wish.filter(x=>x.id!==w.id);
  if(UI.pick===w.id)UI.pick=null;
  if(UI.editWish===w.id)UI.editWish=null;
  save();render();
  toast('حذف شد',{label:'بازگردانی',fn:()=>{S.wish.push(copy);save();render();}});
}
/* مقدارهای order باید یکتا باشند تا جابه‌جایی کار کند */
function ensureUniqueOrder(){
  const seen=new Set();let dup=false;
  for(const w of S.wish){if(seen.has(w.order)){dup=true;break;}seen.add(w.order);}
  if(dup)[...S.wish].sort((a,b)=>a.order-b.order||a.added-b.added).forEach((w,k)=>{w.order=k+1;});
}

  function commitOrder(){
    ensureUniqueOrder();
    const objs=[...listBox.children].map(e=>S.wish.find(w=>w.id===(e.dataset&&e.dataset.id))).filter(Boolean);
    const orders=objs.map(w=>w.order).sort((a,b)=>a-b);
    objs.forEach((w,k)=>{w.order=orders[k];});
    save();
  }
  /* کشیدن با Pointer Events (ماوس و لمس). جابه‌جا کردن عنصر در DOM قفل اشاره‌گر را رها می‌کند؛
     پس شنونده‌ها روی document هستند و بعد از هر جابه‌جایی قفل دوباره گرفته می‌شود. */
  function enableDrag(){
    listBox.querySelectorAll('.drag').forEach(hd=>{
      hd.addEventListener('pointerdown',e=>{
        if(e.button>0)return;
        e.preventDefault();
        const row=hd.closest('.item'),pid=e.pointerId;
        const grab=()=>{try{hd.setPointerCapture(pid);}catch(_){}};
        grab();
        row.classList.add('dragging');
        let lastY=e.clientY,raf=0;
        const place=()=>{
          let before=null;
          for(const r of listBox.children){
            if(r===row)continue;
            const bb=r.getBoundingClientRect();
            if(lastY<bb.top+bb.height/2){before=r;break;}
          }
          if(before!==row.nextElementSibling){listBox.insertBefore(row,before);grab();}
        };
        /* کنار لبه‌ی صفحه خودکار اسکرول می‌شود، حتی اگر انگشت/ماوس ثابت بماند */
        const edge=()=>{   // هرچه به لبه نزدیک‌تر، سریع‌تر
          const from=window.innerHeight-110;
          if(lastY<70)return -(8+20*Math.min(1,(70-lastY)/70));
          if(lastY>from)return 8+20*Math.min(1,(lastY-from)/110);
          return 0;
        };
        const tick=()=>{
          raf=0;
          const d=edge();if(!d)return;
          const y0=window.scrollY;window.scrollBy(0,d);
          place();
          if(window.scrollY!==y0)raf=requestAnimationFrame(tick);
        };
        const mv=ev=>{
          if(ev.pointerId!==pid)return;
          lastY=ev.clientY;place();
          if(edge()&&!raf)raf=requestAnimationFrame(tick);
        };
        const up=ev=>{
          if(ev&&ev.pointerId!==pid)return;
          cancelAnimationFrame(raf);
          document.removeEventListener('pointermove',mv);
          document.removeEventListener('pointerup',up);
          document.removeEventListener('pointercancel',up);
          try{hd.releasePointerCapture(pid);}catch(_){}
          row.classList.remove('dragging');
          commitOrder();
        };
        document.addEventListener('pointermove',mv);
        document.addEventListener('pointerup',up);
        document.addEventListener('pointercancel',up);
      });
    });
  }
  function renderList(){
    const a=visible(),man=isManual();
    listBox.replaceChildren(...(a.length?a.map(w=>wishRow(w,man,move)):[h('p',{class:'muted',text:'موردی با این فیلتر نیست.'})]));
    hintEl.hidden=!man;
    if(man)enableDrag();
  }
  root.append(h('div',{class:'card filters'},
    h('div',{class:'row'},
      h('label',{class:'fld'},h('span',{text:'دسته'}),select([['','همه'],...CATS.map(c=>[c.id,c.icon+' '+c.name])],UI.wishCat,v=>{UI.wishCat=v;renderList();})),
      wishTags.length?h('label',{class:'fld'},h('span',{text:'تگ'}),select([['','همه'],...wishTags.map(t=>[t,'#'+t])],UI.wishTag,v=>{UI.wishTag=v;renderList();})):null,
      h('label',{class:'fld'},h('span',{text:'مرتب‌سازی'}),select([['prio','اولویت'],['new','جدیدترین افزوده'],['old','قدیمی‌ترین افزوده'],['dur','کوتاه‌ترین اول'],['manual','ترتیب دلخواه (کشیدن)']],UI.wishSort,v=>{UI.wishSort=v;renderList();}))),
    h('div',{class:'count-line'},h('span',{text:`${fa(S.wish.length)} مورد در انتظار`}))),
    hintEl,listBox);
  renderList();
  return root;
}

/* ---------- آمار ---------- */
function computeStats(items){
  const total=items.length;
  const rated=items.filter(i=>i.rating>0);
  const avg=rated.length?rated.reduce((s,i)=>s+i.rating,0)/rated.length:0;
  const byCat=Object.create(null);
  CATS.forEach(c=>{byCat[c.id]={n:0,sum:0,r:0};});
  items.forEach(i=>{const b=byCat[i.cat];b.n++;if(i.rating){b.sum+=i.rating;b.r++;}});
  const months=Array(12).fill(0);
  items.forEach(i=>{months[toCal(i.date).m-1]++;});
  const tags=Object.create(null);
  items.forEach(i=>i.tags.forEach(t=>{tags[t]=(tags[t]||0)+1;}));
  const tagList=Object.entries(tags).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'fa'));
  const top=[...rated].sort((a,b)=>b.rating-a.rating||(+b.fav)-(+a.fav)||b.date.localeCompare(a.date));
  const hours=items.reduce((a,i)=>a+(i.hours||0),0);
  const pages=items.reduce((a,i)=>a+(kindOf(i.cat).unit==='صفحه'?(i.status==='done'?(i.total||i.cur):i.cur):0),0);
  return {total,avg,ratedN:rated.length,byCat,months,tagList,top,hours,pages,
    favN:items.filter(i=>i.fav).length,doneN:items.filter(i=>i.status==='done').length};
}
function tile(icon,label,value){
  return h('div',{class:'card tile'},h('div',{class:'ti','aria-hidden':'true',text:icon}),h('div',{class:'tv',text:value}),h('div',{class:'tl',text:label}));
}
function section(title,...kids){return h('section',{class:'card sec'},h('h2',{text:title}),...kids);}
function donut(st){
  const NS='http://www.w3.org/2000/svg';
  const mk=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const svg=mk('svg',{viewBox:'0 0 42 42','class':'donut',role:'img','aria-label':'نمودار سهم هر دسته از کل کارها'});
  svg.append(mk('circle',{cx:21,cy:21,r:15.9155,fill:'none','stroke-width':6,style:'stroke:var(--line)'}));
  let acc=0;
  CATS.forEach(c=>{
    const n=st.byCat[c.id].n;
    if(!n)return;
    const pct=n/st.total*100;
    svg.append(mk('circle',{cx:21,cy:21,r:15.9155,fill:'none','stroke-width':6,stroke:c.color,'stroke-dasharray':`${pct} ${100-pct}`,'stroke-dashoffset':25-acc}));
    acc+=pct;
  });
  const t=mk('text',{x:21,y:23.4,'text-anchor':'middle','font-size':'8','font-weight':'700',style:'fill:var(--ink)'});
  t.textContent=fa(st.total);
  svg.append(t);
  return svg;
}

/* ---------- اهداف ---------- */
function viewGoals(){
  const cal=S.settings.cal,y=UI.year,root=h('div',{class:'view'});
  const G=S.goals[cal];
  const calName=k=>k==='jalali'?'شمسی':'میلادی';
  const done=itemsOfYear().filter(i=>i.status==='done');
  const card=h('section',{class:'card sec'},
    h('h2',{text:`چالش سال ${fa(y)} (${calName(cal)})`}),
    h('p',{class:'muted',style:'margin-bottom:6px;font-size:.9rem',text:'برای هر دسته هدف سالانه بنویس (مثلاً ۲۴ کتاب). فقط موارد «تمام‌شده» حساب می‌شوند. خالی یا صفر یعنی بدون هدف. اهداف هر تقویم جدا نگهداری می‌شوند.'}));

  /* کپی اهداف: از سال قبل یا از تقویم دیگر (فقط وقتی هدفی برای این سال نیست) */
  if(!G[y]){
    const copies=[];
    if(G[y-1])copies.push({label:`کپی اهداف سال ${fa(y-1)}`,src:G[y-1]});
    const other=cal==='jalali'?'gregorian':'jalali';
    const mid=fromCal(y,7,1,cal);
    const oy=toCal(mid,other).y;
    if(S.goals[other][oy])copies.push({label:`کپی اهداف سال ${fa(oy)} (${calName(other)})`,src:S.goals[other][oy]});
    if(copies.length)card.append(h('div',{class:'dlg-actions',style:'justify-content:flex-start;margin-bottom:6px'},
      copies.map(c=>h('button',{class:'btn sm',type:'button',text:'📋 '+c.label,onclick:()=>{G[y]={...c.src};save();render();toast('اهداف کپی شد');}}))));
  }

  CATS.forEach(c=>{
    const n=done.filter(i=>i.cat===c.id).length;
    const txt=h('span'),bar=h('i',{style:'width:0'}),barBox=h('div',{class:'bar',style:`--c:${c.color}`},bar),st=h('span',{class:'muted'});
    /* فیلد متنی با کیبورد عددی تا ارقام فارسی هم پذیرفته شوند */
    const input=h('input',{type:'text',inputmode:'numeric',maxlength:'4',placeholder:'—','aria-label':`هدف سالانه‌ی ${c.name}`,autocomplete:'off'});
    const cur=(G[y]&&G[y][c.id])||0;
    input.value=cur?fa(cur):'';
    function paint(){
      const t=(G[y]&&G[y][c.id])||0;
      const pct=t?Math.min(100,n/t*100):0;
      bar.style.width=pct+'%';
      barBox.hidden=!t;
      txt.textContent=t?`${fa(n)} از ${fa(t)}`:`${fa(n)} تمام‌شده`;
      st.textContent=t?(n>=t?'🎉 تکمیل شد':`${fa(Math.round(pct))}٪`):'';
      barBox.setAttribute('role','progressbar');
      barBox.setAttribute('aria-valuenow',String(Math.round(pct)));
      barBox.setAttribute('aria-valuemin','0');barBox.setAttribute('aria-valuemax','100');
      barBox.setAttribute('aria-label',`پیشرفت ${c.name}`);
    }
    input.addEventListener('input',()=>{
      const v=toLatin(input.value).replace(/\D/g,'').slice(0,4);
      input.value=v?fa(v):'';
    });
    input.addEventListener('change',()=>{
      const v=Math.max(0,Math.min(9999,parseInt(toLatin(input.value),10)||0));
      if(v){(G[y]=G[y]||{})[c.id]=v;}
      else if(G[y]){delete G[y][c.id];if(!Object.keys(G[y]).length)delete G[y];}
      input.value=v?fa(v):'';
      save();paint();
    });
    paint();
    card.append(h('div',{class:'goal'},
      h('div',{class:'gi','aria-hidden':'true',text:c.icon}),
      h('div',{},h('div',{class:'gt'},h('strong',{text:c.name}),txt,st),barBox),
      input));
  });
  root.append(card);
  return root;
}

/* ---------- داده‌ها: خروجی، ورودی، چاپ ---------- */
/* داخل اپ اندروید (Capacitor) دانلود با لینک کار نمی‌کند؛ فایل در حافظه‌ی موقت نوشته و با منوی اشتراک‌گذاری اندروید
   باز می‌شود (ذخیره در فایل‌ها، Drive، ارسال در تلگرام، باز کردن با Excel و...). */
const CAP=window.Capacitor;
const NATIVE=!!(CAP&&typeof CAP.isNativePlatform==='function'&&CAP.isNativePlatform());
const capPlugin=n=>CAP&&CAP.Plugins&&CAP.Plugins[n];
async function nativeSave(name,blob){
  const FS=capPlugin('Filesystem'),SH=capPlugin('Share');
  if(!FS||!SH)throw new Error('plugin missing');
  const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(r.error);r.onload=()=>res(String(r.result).split(',')[1]||'');r.readAsDataURL(blob);});
  const w=await FS.writeFile({path:name,data:b64,directory:'CACHE'});
  await SH.share({title:name,dialogTitle:'ذخیره یا ارسال فایل',url:w.uri});
}
/* نتیجه: Promise<boolean>؛ true یعنی فایل داده شد. در اندروید اگر کاربر منوی اشتراک را ببندد false است
   و «پشتیبان گرفته شد» ثبت نمی‌شود. در مرورگر دانلود قابل‌تشخیص نیست و true حساب می‌شود. */
function downloadBlob(name,blob){
  if(NATIVE)return nativeSave(name,blob).then(()=>true,e=>{
    if(!/cancel/i.test(String(e&&e.message||e)))toast('ذخیره‌ی فایل ممکن نشد');
    return false;});
  const url=URL.createObjectURL(blob);
  const a=h('a',{href:url,download:name});
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  return Promise.resolve(true);
}
function download(name,mime,text){return downloadBlob(name,new Blob([text],{type:mime}));}
function markExported(){S.settings.lastExport=Date.now();save();render();}
const afterExport=(p,msg)=>p.then(done=>{if(done){markExported();toast(msg);}});
function exportJSON(){
  const payload={app:'personal-year-journal',version:2,exported:new Date().toISOString(),cats:S.cats,items:S.items,wish:S.wish,goals:S.goals};
  afterExport(download(`year-journal-${todayISO()}.json`,'application/json',JSON.stringify(payload,null,2)),'فایل پشتیبان ذخیره شد');
}
function csvCell(v){
  let s=String(v==null?'':v);
  if(/^[=+\-@\t\r]/.test(s))s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
}
function exportCSV(){
  const head=['عنوان','دسته','امتیاز','وضعیت','تاریخ میلادی','تاریخ شمسی','سازنده/پلتفرم','تگ‌ها','موردعلاقه','لینک','توضیح','مکان','فصل','ساعت','پیشرفت فعلی','کل','چندمین بار'];
  const rows=[...S.items].sort((a,b)=>a.date.localeCompare(b.date)).map(i=>[
    i.title,CAT[i.cat].name,i.rating||'',STATUS[i.status],i.date,fmtDate(i.date,'jalali'),i.creator,i.tags.join('، '),i.fav?'بله':'',i.link,i.notes,i.place,i.season||'',i.hours||'',i.cur||'',i.total||'',i.times]);
  const text='\ufeff'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
  afterExport(download(`year-journal-${todayISO()}.csv`,'text/csv;charset=utf-8',text),'فایل CSV ذخیره شد');
}
/* ---------- خروجی Excel (.xlsx) بدون هیچ کتابخانه‌ای ----------
   فایل xlsx یک zip از چند فایل XML است؛ اینجا zip بدون فشرده‌سازی ساخته می‌شود. */
const XLSX_MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function zipStore(files,mime){
  const enc=new TextEncoder(),parts=[],central=[];
  const d=new Date(),dt=((Math.max(d.getFullYear(),1980)-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  const tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  let off=0;
  files.forEach(([name,text])=>{
    const nb=enc.encode(name),data=enc.encode(text),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);
    lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);
    lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(lh.buffer),nb,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nb.length,true);
    ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nb);
    off+=30+nb.length+data.length;
  });
  const cdSize=central.reduce((a,b)=>a+b.length,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);
  e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:mime});
}
const xesc=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function xcol(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}

/* سبک‌ها: 0 پیش‌فرض، 1 سرستون، 2 تاریخ، 3 متن چندخطی، 4 وسط‌چین، 5 درصد */
const XL_STYLES='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
  +'<numFmts count="1"><numFmt numFmtId="164" formatCode="yyyy\\-mm\\-dd"/></numFmts>'

  +'<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF3B5BA9"/><bgColor indexed="64"/></patternFill></fill></fills>'
  +'<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
  +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
  +'<cellXfs count="6">'
  +'<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top"/></xf>'
  +'<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>'
  +'<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf>'
  +'<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>'

/* سلول: null | رشته | عدد | {v,s} */
function xlSheetXml(head,rows,widths){
  const cell=(v,r,c,hd)=>{
    let s=hd?1:null;
    if(v&&typeof v==='object'){s=v.s;v=v.v;}
    if(v==null||v===''||(typeof v==='number'&&!isFinite(v)))return hd?`<c r="${xcol(c)}${r}" s="1"/>`:'';
    const ref=xcol(c)+r;
    if(typeof v==='number')return `<c r="${ref}" s="${s==null?4:s}"><v>${v}</v></c>`;
    return `<c r="${ref}" s="${s==null?3:s}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;
  };
  const line=(cells,r,hd)=>`<row r="${r}"${hd?' ht="24" customHeight="1"':''}>${cells.map((v,c)=>cell(v,r,c,hd)).join('')}</row>`;
  const last=xcol(head.length-1)+(rows.length+1);
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    +`<dimension ref="A1:${last}"/>`
    +'<sheetViews><sheetView rightToLeft="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A2" sqref="A2"/></sheetView></sheetViews>'
    +'<sheetFormatPr defaultRowHeight="15"/>'
    +`<cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>`
    +`<sheetData>${line(head,1,true)}${rows.map((r,i)=>line(r,i+2,false)).join('')}</sheetData>`
    +`<autoFilter ref="A1:${last}"/></worksheet>`;
}
function buildXlsx(sheets){
  const files=[
    ['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      +sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>'],
    ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>'
      +sheets.map((s,i)=>`<sheet name="${xesc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      +sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')
      +`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml',XL_STYLES],
    ...sheets.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,xlSheetXml(s.head,s.rows,s.widths)])
  ];
  return zipStore(files,XLSX_MIME);
}
/* year: عدد = فقط همان سال؛ بدون آن = همه‌ی سال‌ها */
function exportXLSX(year){
  const cal=S.settings.cal;
  const items=[...S.items].filter(i=>!year||yearOf(i.date)===year).sort((a,b)=>a.date.localeCompare(b.date));
  if(!items.length&&!S.wish.length){toast('چیزی برای خروجی گرفتن نیست');return;}
  const cn=id=>CAT[id]?CAT[id].name:'';
  const sheets=[];
  sheets.push({name:'دفتر',
    head:['تاریخ','تاریخ شمسی','سال شمسی','عنوان','دسته','امتیاز','وضعیت','سازنده / پلتفرم','تگ‌ها','موردعلاقه','توضیح','لینک','مکان','فصل','ساعت','پیشرفت فعلی','کل','چندمین بار'],
    widths:[13,18,10,32,13,9,14,20,22,10,48,30,16,8,8,12,8,10],
    rows:items.map(i=>[{v:xlDate(i.date),s:2},fmtDate(i.date,'jalali'),toCal(i.date,'jalali').y,i.title,cn(i.cat),i.rating||null,STATUS[i.status],i.creator,i.tags.join('، '),i.fav?'بله':null,i.notes,i.link,i.place,i.season||null,i.hours||null,i.cur||null,i.total||null,i.times>1?i.times:null])});
  const wish=[...S.wish].sort((a,b)=>(a.order||0)-(b.order||0));
  sheets.push({name:'بعداً',
    head:['عنوان','دسته','اولویت','مدت تقریبی','منبع','تگ‌ها','یادداشت','لینک','تاریخ افزودن'],
    widths:[34,13,10,16,20,22,44,30,13],
    rows:wish.map(w=>[w.title,cn(w.cat),(PRIO.find(p=>p[0]===w.priority)||[])[1],w.dur?DURS[w.dur]:null,w.source,w.tags.join('، '),w.note,w.link,{v:xlDate(todayISOFromMs(w.added)),s:2}])});
  /* آمار هر سال به تفکیک دسته (قالب بلند: برای جدول محوری هم مناسب است) */
  const years=[...new Set(items.map(i=>yearOf(i.date)))].sort((a,b)=>b-a);
  const stat=[];
  years.forEach(y=>{
    const yi=items.filter(i=>yearOf(i.date)===y);
    const row=(label,list)=>{
      const rated=list.filter(i=>i.status==='done'&&i.rating);
      stat.push([y,label,list.length,list.filter(i=>i.status==='done').length,list.filter(i=>i.status==='doing').length,list.filter(i=>i.status==='dropped').length,
        rated.length?Math.round(rated.reduce((a,i)=>a+i.rating,0)/rated.length*100)/100:null,
        Math.round(list.reduce((a,i)=>a+(i.hours||0),0)*10)/10||null,list.filter(i=>i.fav).length||null]);
    };
    row('همه‌ی دسته‌ها',yi);
    CATS.forEach(c=>{const l=yi.filter(i=>i.cat===c.id);if(l.length)row(c.name,l);});
  });
  sheets.push({name:'آمار',head:['سال','دسته','کل ثبت‌ها','تمام‌شده','در حال انجام','نیمه‌رها','میانگین امتیاز','مجموع ساعت','موردعلاقه'],
    widths:[9,18,11,11,13,11,14,13,12],rows:stat});
  /* اهداف سالانه (برای تقویم فعلی) */
  const goalRows=[];
  Object.keys(S.goals[cal]||{}).map(Number).filter(y=>!year||y===year).sort((a,b)=>b-a).forEach(y=>{
    CATS.forEach(c=>{
      const n=(S.goals[cal][y]||{})[c.id];if(!(n>0))return;
      const done=S.items.filter(i=>yearOf(i.date)===y&&i.cat===c.id&&i.status==='done').length;
      goalRows.push([y,c.name,n,done,{v:Math.round(done/n*1000)/1000,s:5}]);
    });
  });
  if(goalRows.length)sheets.push({name:'اهداف',head:['سال','دسته','هدف','انجام‌شده','درصد'],widths:[9,18,9,12,10],rows:goalRows});
  afterExport(downloadBlob(`year-journal-${year||'all'}-${todayISO()}.xlsx`,buildXlsx(sheets)),'فایل Excel ذخیره شد');
}
function exportMD(){
  const items=itemsOfYear().sort((a,b)=>a.date.localeCompare(b.date));
  if(!items.length){toast('برای این سال چیزی ثبت نشده');return;}
  const L=[`# دفتر سال ${fa(UI.year)}`,'',`${fa(items.length)} مورد`,''];
  CATS.forEach(c=>{
    const l=items.filter(i=>i.cat===c.id);if(!l.length)return;
    L.push(`## ${c.icon} ${c.name} (${fa(l.length)})`,'');
    l.forEach(i=>{
      const meta=[i.rating?`⭐ ${i.rating}/5`:'',i.creator,fmtDate(i.date),i.status!=='done'?STATUS[i.status]:'',i.tags.map(t=>'#'+t.replace(/\s+/g,'_')).join(' ')].filter(Boolean).join(' · ');
      L.push(`- **${i.title.replace(/[*_`\[\]]/g,'\\$&')}**${i.fav?' ❤️':''}${meta?' — '+meta:''}`);

    });
    L.push('');
  });
  afterExport(download(`year-journal-${UI.year}.md`,'text/markdown;charset=utf-8','﻿'+L.join('\n')),'فایل Markdown ذخیره شد');
}
function importFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onerror=()=>toast('خواندن فایل ممکن نشد');
  reader.onload=()=>{
    let o;
    try{o=JSON.parse(String(reader.result));}catch(e){toast('فایل JSON معتبر نیست');return;}
    if(Array.isArray(o))o={items:o};
    importDialog(o);
  };
  reader.readAsText(file);
}
function importDialog(o){
  const items=uniqueIds((Array.isArray(o&&o.items)?o.items:[]).map(cleanItem).filter(Boolean));
  const wish=uniqueIds((Array.isArray(o&&o.wish)?o.wish:[]).map(cleanWish).filter(Boolean));
  const goals=cleanGoals(o&&o.goals);

  if(!items.length&&!wish.length&&!hasGoals(goals)){toast('در این فایل داده‌ی قابل‌استفاده‌ای پیدا نشد');return;}

    h('p',{class:'muted',style:'font-size:.9rem',text:'«ادغام» موارد جدید را به داده‌های فعلی اضافه می‌کند (موارد تکراری رد می‌شوند). «جایگزینی» همه‌ی داده‌های فعلی را پاک می‌کند.'}),
    h('div',{class:'dlg-actions'},
      h('button',{class:'btn ghost',type:'button',text:'انصراف',onclick:()=>d.close()}),

        if(!(await askConfirm(`همه‌ی داده‌های فعلی (${fa(S.items.length)} مورد دفتر و ${fa(S.wish.length)} مورد «بعداً») پاک و با محتوای این فایل عوض می‌شوند. ادامه می‌دهی؟`,'بله، جایگزین کن')))return;
        const prev=JSON.stringify(S);   // برای «برگرداندن»
        S.items=items;S.wish=wish;S.goals=goals;S.settings.seeded=true;
        S.cats=cats||DEFAULT_CATS.map(c=>({...c}));applyCats(S.cats);fixCatRefs(S);
        base=idsOf(S);   // جایگزینی عمدی است؛ حذف‌ها را به‌عنوان تغییر تب دیگر حساب نکن

      h('button',{class:'btn primary',type:'button',text:'ادغام',onclick:()=>{
        const ids=new Set(S.items.map(x=>x.id)),wids=new Set(S.wish.map(x=>x.id));
