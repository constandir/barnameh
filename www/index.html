    section('میانبرهای صفحه‌کلید',
      h('div',{class:'sc'},
        h('div',{},h('span',{class:'kbd',text:'N'}),h('span',{text:'ثبت مورد جدید'})),
        h('div',{},h('span',{class:'kbd',text:'/'}),h('span',{text:'جستجو در دفتر'})),
        h('div',{},h('span',{class:'kbd',text:'Q'}),h('span',{text:'ثبت سریع'})),
        h('div',{},h('span',{class:'kbd',text:'1 – 6'}),h('span',{text:'رفتن به بخش‌ها'})),
        h('div',{},h('span',{class:'kbd',text:'Esc'}),h('span',{text:'بستن پنجره‌ها'})))));
  return root;
}
let prevTheme='auto';

/* ============================================================
   ۱۰) سربرگ، ناوبری، پوسته، رندر اصلی
   ============================================================ */
const THEME_ICON={auto:'🌓',light:'☀️',dark:'🌙'};
const THEME_NAME={auto:'خودکار',light:'روشن',dark:'تاریک'};
/* رنگ نوار مرورگر (theme-color) و رنگ آیکون‌های نوار وضعیت اندروید را با پوسته‌ی انتخابی هماهنگ نگه می‌دارد */
const darkQuery=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function isDarkNow(){const t=S.settings.theme;return t==='dark'||(t==='auto'&&!!(darkQuery&&darkQuery.matches));}
function syncChrome(){
  const dark=isDarkNow();
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',dark?'#15141a':'#f6f1e6');
  const SB=capPlugin('SystemBars');
  if(NATIVE&&SB&&typeof SB.setStyle==='function'){try{Promise.resolve(SB.setStyle({style:dark?'DARK':'LIGHT'})).catch(()=>{});}catch(e){}}
}
if(darkQuery&&darkQuery.addEventListener)darkQuery.addEventListener('change',syncChrome);
function applyTheme(){
  const t=S.settings.theme;
  if(t==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  syncChrome();
}
function cycleTheme(){
  const order=['auto','light','dark'];
  S.settings.theme=order[(order.indexOf(S.settings.theme)+1)%3];
  prevTheme=S.settings.theme;
  applyTheme();save();render();
  toast('پوسته: '+THEME_NAME[S.settings.theme]);
}
function toggleCal(){
  /* سالِ انتخاب‌شده به تقویم دیگر برگردانده می‌شود (با وسط سال)، نه اینکه به سال جاری برگردد */
  const old=S.settings.cal,mid=fromCal(UI.year||curYear(),7,1,old);
  S.settings.cal=old==='jalali'?'gregorian':'jalali';
  UI.year=toCal(mid,S.settings.cal).y;UI.filters.month=0;
  save();render();
  toast('تقویم: '+(S.settings.cal==='jalali'?'شمسی':'میلادی'));
}
function renderHeader(){
  const ysel=select(yearList().map(y=>[y,fa(y)]),UI.year,v=>{UI.year=+v;UI.filters.tag='';UI.filters.month=0;render();},{class:'year-sel','aria-label':'انتخاب سال'});
  $('#top').replaceChildren(h('div',{class:'top-in'},
    h('div',{class:'brand'},h('span',{class:'logo','aria-hidden':'true',text:'📔'}),h('h1',{text:'دفتر سالانه‌ی من'})),
    h('div',{class:'tools'},
      ysel,
      h('button',{class:'chip-btn',type:'button',onclick:toggleCal,title:'تغییر تقویم','aria-label':'تغییر تقویم؛ اکنون '+(S.settings.cal==='jalali'?'شمسی':'میلادی'),text:S.settings.cal==='jalali'?'شمسی':'میلادی'}),
      h('button',{class:'chip-btn',type:'button',onclick:cycleTheme,title:'پوسته: '+THEME_NAME[S.settings.theme],'aria-label':'تغییر پوسته؛ اکنون '+THEME_NAME[S.settings.theme],text:THEME_ICON[S.settings.theme]}))));
}
function renderNav(){
  $('#nav').replaceChildren(...TABS.map(t=>h('button',{type:'button','aria-current':UI.tab===t.id?'page':null,onclick:()=>go(t.id)},
    h('span',{class:'ni','aria-hidden':'true',text:t.icon}),h('span',{text:t.label}))));
}
const VIEWS={journal:viewJournal,wish:viewWish,stats:viewStats,goals:viewGoals,wrapped:viewWrapped,data:viewData};
/* رندر دوباره همه‌ی عناصر را از نو می‌سازد؛ فوکوس کیبورد را به عنصر هم‌ارزش برمی‌گردانیم
   (اگر عنصر دیگر نبود، مثلاً بعد از حذف، فوکوس به بدنه‌ی اصلی می‌رود تا به ابتدای صفحه نپرد). */
const fkey=e=>e.getAttribute('aria-label')||e.getAttribute('title')||e.id||(e.textContent||'').trim().slice(0,40)||e.getAttribute('placeholder')||'';
function focusSig(el){
  const root=el.closest('#app,#nav,#top');
  if(!root)return null;
  const tag=el.tagName.toLowerCase(),key=fkey(el);
  const same=[...root.querySelectorAll(tag)].filter(x=>fkey(x)===key);
  return {root:'#'+root.id,tag,key,idx:same.indexOf(el)};
}
function restoreFocus(sig){
  if(!sig)return;
  const root=$(sig.root);
  if(!root)return;
  const t=[...root.querySelectorAll(sig.tag)].filter(x=>fkey(x)===sig.key)[sig.idx];
  try{
    if(t)t.focus({preventScroll:true});
    else if(sig.root==='#app')root.focus({preventScroll:true});
  }catch(e){}
}
function render(){
  const a=document.activeElement;
  const sig=(a&&a!==document.body&&!a.closest('dialog'))?focusSig(a):null;
  renderHeader();renderNav();renderDatalists();
  $('#fab').hidden=!['journal','stats','goals'].includes(UI.tab);
  const withBanners=['journal','wish'].includes(UI.tab);
  $('#app').replaceChildren(...(withBanners?banners():[]),VIEWS[UI.tab]());
  restoreFocus(sig);
}
function go(tab){
  UI.tab=tab;render();
  window.scrollTo(0,0);
}

/* ---------- میانبرهای صفحه‌کلید ---------- */
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(document.querySelector('dialog[open]'))return;
  const t=e.target,tn=t&&t.tagName;
  if(tn==='INPUT'||tn==='TEXTAREA'||tn==='SELECT'||(t&&t.isContentEditable))return;
  if(e.code==='KeyN'){e.preventDefault();openItemForm(null);}
  else if(e.code==='KeyQ'){e.preventDefault();go('journal');const q=$('#qTitle');if(q)q.focus();}
  else if(e.code==='Slash'){
    e.preventDefault();
    if(UI.tab!=='journal')go('journal');
    const s=$('#search');if(s)s.focus();
  }else if(/^Digit[1-6]$/.test(e.code)){go(TABS[+e.code.slice(5)-1].id);}
});
$('#fab').addEventListener('click',()=>openItemForm(null));
/* دکمه‌ی برگشت اندروید: اول بستن پنجره، بعد برگشت به «دفتر»، در آخر خروج */
if(NATIVE&&capPlugin('App')){
  capPlugin('App').addListener('backButton',()=>{
    const d=document.querySelector('dialog[open]');
    if(d){d.close();return;}
    if(UI.tab!=='journal'){go('journal');return;}
    capPlugin('App').exitApp();
  });
}

/* ============================================================
   ۱۱) شروع
   ============================================================ */
(function init(){
  prevTheme=S.settings.theme;
  applyTheme();
  if(!S.settings.seeded&&!S.items.length&&!S.wish.length)seedDemo();
  S.settings.seeded=true;
  save();
  UI.year=curYear();
  render();
})();
})();
</script>
</body>
</html>
